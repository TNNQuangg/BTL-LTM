server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
game.demo-seed.enabled=${GAME_DEMO_SEED_ENABLED:false}
game.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:*}
game.reconnect-grace-ms=30000
game.heartbeat-interval-ms=5000
game.heartbeat-timeout-ms=12000
game.scoring.minimum-exposure-ms=10000

# ==============================================================================
# Cấu hình Cơ sở dữ liệu mặc định: H2 Database (Nhúng, Chạy ngay không cần cài MySQL)
# Dữ liệu được lưu trữ bền vững tại file ./data/game_db.mv.db
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/game_db;DB_CLOSE_DELAY=-1;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Cho phép truy cập console quản trị H2 tại: http://localhost:8080/h2-console
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Bộ đệm WebSocket truyền tải nét vẽ mượt mà không bị ngắt
server.servlet.context-parameters.org.apache.tomcat.websocket.textBufferSize=10485760
server.servlet.context-parameters.org.apache.tomcat.websocket.binaryBufferSize=10485760
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB
