server.port=8080
server.address=0.0.0.0

# ==============================================================================
# Cấu hình Cơ sở dữ liệu mặc định: H2 Database (Nhúng, Chạy ngay không cần cài MySQL)
# Dữ liệu được lưu trữ bền vững tại file ./data/game_db.mv.db
# ==============================================================================
spring.datasource.url=jdbc:h2:file:./data/game_db;DB_CLOSE_DELAY=-1;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Cho phép truy cập console quản trị H2 tại: http://localhost:8080/h2-console
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Bộ đệm WebSocket truyền tải nét vẽ mượt mà không bị ngắt
server.servlet.context-parameters.org.apache.tomcat.websocket.textBufferSize=10485760
server.servlet.context-parameters.org.apache.tomcat.websocket.binaryBufferSize=10485760
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB
