server.port=${SERVER_PORT:8080}

# ==============================================================================
# Cấu hình Cơ sở dữ liệu MySQL (Kích hoạt khi chạy với -Dspring-boot.run.profiles=mysql)
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/scribble_game?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Bộ đệm WebSocket truyền tải nét vẽ
server.servlet.context-parameters.org.apache.tomcat.websocket.textBufferSize=10485760
server.servlet.context-parameters.org.apache.tomcat.websocket.binaryBufferSize=10485760
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB
