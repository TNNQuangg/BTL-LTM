# ============================================
# Cấu hình Spring Boot — Vẽ Hình Đoán Ý (Nhóm 8)
# ============================================

# Server port (giữ nguyên 9999 như phiên bản cũ)
server.port=9999

# ============================================
# Cấu hình MySQL (chuyển từ hibernate.cfg.xml)
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/scribble_game?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# Cấu hình JPA / Hibernate
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# =============================
# Google OAuth2 Configuration
# =============================
spring.security.oauth2.client.registration.google.client-id=YOUR_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
